# APDCH Patient Feedback System — Docker stack for the shared VPS.
#
# The MAPIMS feedback app already runs on the same server as project "pfs"
# (pfs_frontend :8091, pfs_backend :5014, pfs_mongo). Every name, port and volume
# here is distinct so `docker compose up` never touches that stack or its data.
#
# Host ports follow the server's 100N / 200N / 300N scheme, slot 7:
#   1007 → frontend (SPA + /api proxied to the backend); host nginx serves the domain from here
#   2007 → backend API, localhost only (debugging from the VPS)
#   3007 → MongoDB, localhost only (mongosh / backups from the VPS)
# Volumes are prefixed with the project name: apdch_pfs_mongo_data, apdch_pfs_uploads_data.

name: apdch_pfs

services:
  mongodb:
    image: mongo:7
    container_name: apdch_pfs_mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:3007:27017"
    environment:
      TZ: Asia/Kolkata
      MONGO_INITDB_DATABASE: apdch_feedback
    volumes:
      - mongo_data:/data/db
    networks:
      - net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apdch_pfs_backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:2007:5000"
    environment:
      PORT: "5000"
      MONGODB_URI: mongodb://mongodb:27017/apdch_feedback
      # TMS integration — leave unset if you don't want forwarding to TMS.
      # If both stacks share a Docker network, use http://tms_backend:5000.
      TMS_API_URL: ${TMS_API_URL:-}
      TMS_EMP_ID: ${TMS_EMP_ID:-}
      TMS_PASSWORD: ${TMS_PASSWORD:-}
      TMS_FEEDBACK_DEPARTMENT_ID: ${TMS_FEEDBACK_DEPARTMENT_ID:-}
      TMS_FEEDBACK_CATEGORY_ID: ${TMS_FEEDBACK_CATEGORY_ID:-}
      TMS_FEEDBACK_SUBCATEGORY_ID: ${TMS_FEEDBACK_SUBCATEGORY_ID:-}
      TMS_FEEDBACK_PRIORITY: ${TMS_FEEDBACK_PRIORITY:-}
      TMS_CLIENT_URL: ${TMS_CLIENT_URL:-}
    # Create backend/.env on the server from backend/.env.example (secrets, OPENROUTER_API_KEY, TMS_*, etc.)
    env_file:
      - ./backend/.env
    volumes:
      # Persistent voice/bot recordings — survives container rebuilds.
      - uploads_data:/app/uploads
    depends_on:
      - mongodb
    networks:
      - net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: apdch_pfs_frontend
    restart: unless-stopped
    ports:
      - "1007:80"
    depends_on:
      - backend
    networks:
      - net

volumes:
  mongo_data:
  uploads_data:

networks:
  net:
    driver: bridge
