# Host nginx for pfs.apdch.mapims.edu.in → APDCH PFS frontend container (apdch_pfs_frontend, host port 1007)
#
# Plain HTTP to start. To add HTTPS, run on the server:
#   sudo certbot --nginx -d pfs.apdch.mapims.edu.in
# certbot adds the 443 block and the HTTP→HTTPS redirect to this file.

server {
    listen 80;
    server_name pfs.apdch.mapims.edu.in;

    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:1007;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;
    }
}
